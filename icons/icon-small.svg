<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="arrow"
      d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3
         L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z"/>
    <radialGradient id="bgshine" cx="32%" cy="24%" r="85%">
      <stop offset="0%" stop-color="#303036"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </radialGradient>
  </defs>

  <!-- Simplified for legibility at 16/32px: one big bold cursor, centered,
       no blur/glow haze - that detail turns to mud at toolbar size. The
       richer multi-cursor version is used at 48px/128px. -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgshine)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none"
        stroke="rgba(255,255,255,.08)" stroke-width="2"/>

  <g transform="translate(64 64) rotate(-18) scale(3.9) translate(-12.85 -11.95)">
    <use href="#arrow" fill="#0D99FF" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
