<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Exact arrow-cursor shape used throughout the extension's own HUD/engine,
         reused here so the toolbar icon reads as "the same cursors" rather than
         a separate illustration. -->
    <path id="arrow"
      d="M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3
         L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z"/>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
    <radialGradient id="bgshine" cx="32%" cy="24%" r="85%">
      <stop offset="0%" stop-color="#303036"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </radialGradient>
  </defs>

  <!-- backdrop, matching the HUD's dark glass panel -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgshine)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none"
        stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>

  <!-- small drawn rect, like a box the swarm is mid-sketching - the rebuild's
       own crosshair-drag motif, kept tiny and understated behind the cursors -->
  <rect x="48" y="48" width="32" height="24" rx="2" fill="none"
        stroke="#0D99FF" stroke-width="2" stroke-dasharray="4 3" opacity=".5"/>

  <!-- three cursors converging on it, each glowing in its own color, same
       palette the swarm itself draws with. Each group: translate to its
       bbox-centered local origin, scale, rotate, then place at its canvas
       position - in that order (rightmost applies first). -->
  <g transform="translate(90 40) rotate(130) scale(2.1) translate(-12.85 -11.95)">
    <use href="#arrow" fill="#9747FF" filter="url(#glow)" opacity=".9"/>
    <use href="#arrow" fill="#9747FF" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(34 72) rotate(12) scale(1.75) translate(-12.85 -11.95)">
    <use href="#arrow" fill="#F24E1E" filter="url(#glow)" opacity=".9"/>
    <use href="#arrow" fill="#F24E1E" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(78 92) rotate(-22) scale(1.9) translate(-12.85 -11.95)">
    <use href="#arrow" fill="#0ACF83" filter="url(#glow)" opacity=".95"/>
    <use href="#arrow" fill="#0ACF83" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
</svg>
